<!DOCTYPE html>

<title>理化互動課本</title>
<style>

  a.card { display: block; background: #fff; border-radius: 14px; padding: 22px; text-decoration: none; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); border-top: 6px solid var(--c); transition: transform .15s; }

  </div>
